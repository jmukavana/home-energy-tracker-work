spring.application.name=usage-service
server.port = 8083

# Actuator & Prometheus (scraped by Prometheus in docker-compose)
management.endpoints.web.exposure.include=health,info,prometheus,circuitbreakers
management.endpoint.health.show-details=when_authorized
management.metrics.tags.application=${spring.application.name}
management.health.circuitbreakers.enabled=true

spring.mvc.problemdetails.enabled=true

#Kafka - consumer
spring.kafka.bootstrap-servers=localhost:9094
spring.kafka.consumer.group-id=usage-service
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=io.confluent.kafka.serializers.KafkaAvroDeserializer
spring.kafka.consumer.properties.schema.registry.url=http://localhost:8086
spring.kafka.consumer.properties.specific.avro.reader=true

#Kafka - producer
spring.kafka.template.default-topic=energy-alerts-v2
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=io.confluent.kafka.serializers.KafkaAvroSerializer
spring.kafka.producer.properties.schema.registry.url=http://localhost:8086


device.service.url=http://localhost:8081/api/v1/device
user.service.url=http://localhost:8080/api/v1/user

#MySQL / Read model
spring.datasource.url=jdbc:mysql://localhost:3306/home_energy_tracker
spring.datasource.username=root
spring.datasource.password=password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=none

# Own Flyway history table: usage-service shares the physical schema with
# user-service/alert-service, so it must not use Flyway's default history
# table name (would collide with user-service's and fail checksum
# validation on whichever service starts second). baseline-on-migrate +
# baseline-version=0 handles starting up when a sibling has already
# populated the shared schema first (see alert-service for full rationale).
spring.flyway.table=flyway_schema_history_usage
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# TimescaleDB — admin/migration connection (postgres superuser), used only by
# TimescaleMigrationRunner. Superusers bypass RLS, so the app itself never uses this.
timescale.datasource.url=jdbc:postgresql://localhost:5433/usage_timeseries
timescale.datasource.username=postgres
timescale.datasource.password=password
timescale.datasource.driver-class-name=org.postgresql.Driver

# TimescaleDB — app runtime connection (restricted usage_app role, created by
# db/timescale/V2__app_role.sql), actually subject to the RLS policy on energy_usage.
timescale.app-datasource.url=jdbc:postgresql://localhost:5433/usage_timeseries
timescale.app-datasource.username=usage_app
timescale.app-datasource.password=usage_app_password
timescale.app-datasource.driver-class-name=org.postgresql.Driver

#Resilience4j - DeviceClient / UserClient (internal service-to-service calls;
# the gateway's circuit breaker only covers gateway->service routes, not these)
resilience4j.circuitbreaker.configs.default.registerHealthIndicator=true
resilience4j.circuitbreaker.configs.default.slidingWindowType=COUNT_BASED
resilience4j.circuitbreaker.configs.default.slidingWindowSize=8
resilience4j.circuitbreaker.configs.default.failureRateThreshold=20
resilience4j.circuitbreaker.configs.default.minimum-number-of-calls=4
resilience4j.circuitbreaker.configs.default.waitDurationInOpenState=5s
resilience4j.circuitbreaker.configs.default.permittedNumberOfCallsInHalfOpenState=2
resilience4j.circuitbreaker.configs.default.automaticTransitionFromOpenToHalfOpenEnabled=true
resilience4j.circuitbreaker.configs.default.ignoreExceptions=org.springframework.web.client.HttpClientErrorException

resilience4j.retry.configs.default.maxAttempts=3
resilience4j.retry.configs.default.waitDuration=200ms
resilience4j.retry.configs.default.enableExponentialBackoff=true
resilience4j.retry.configs.default.exponentialBackoffMultiplier=2
resilience4j.retry.configs.default.retryExceptions=org.springframework.web.client.ResourceAccessException,org.springframework.web.client.HttpServerErrorException

resilience4j.bulkhead.configs.default.maxConcurrentCalls=10
resilience4j.bulkhead.configs.default.maxWaitDuration=0

resilience4j.ratelimiter.configs.default.limitForPeriod=20
resilience4j.ratelimiter.configs.default.limitRefreshPeriod=1s
resilience4j.ratelimiter.configs.default.timeoutDuration=500ms