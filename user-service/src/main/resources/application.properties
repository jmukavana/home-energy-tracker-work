spring.application.name=user-service
server.port=8080
service.port=8080

# Actuator & Prometheus (scraped by Prometheus in docker-compose)
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=when_authorized
management.metrics.tags.application=${spring.application.name}

spring.mvc.problemdetails.enabled=true

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/home_energy_tracker
spring.datasource.username=root
spring.datasource.password=password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=none

# Flyway - user-service is the original schema owner and keeps Flyway's
# default history table name. baseline-on-migrate + baseline-version=0 makes
# startup order-independent: if a sibling service (alert-service/usage-service)
# happens to start first and populates the shared schema, this service would
# otherwise see a "non-empty schema, no history table" error.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0