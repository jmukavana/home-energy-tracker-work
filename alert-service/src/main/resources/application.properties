spring.application.name=alert-service
server.port = 8084

# Actuator & Prometheus (scraped by Prometheus in docker-compose)
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=when_authorized
management.metrics.tags.application=${spring.application.name}

spring.mvc.problemdetails.enabled=true

#Kafka - consumer (rule-triggered alerts)
spring.kafka.bootstrap-servers=localhost:9094
spring.kafka.consumer.group-id=alert-service
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=io.confluent.kafka.serializers.KafkaAvroDeserializer
spring.kafka.consumer.properties.schema.registry.url=http://localhost:8086
spring.kafka.consumer.properties.specific.avro.reader=true

#Kafka - producer (Phase 3: delivery extracted to notification-service, this
# service now only produces the notification request, never sends email itself)
spring.kafka.template.default-topic=notification-requests-v1
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=io.confluent.kafka.serializers.KafkaAvroSerializer
spring.kafka.producer.properties.schema.registry.url=http://localhost:8086

# MySQL Database Configuration (Flyway-only now — no JPA entities left after
# Phase 3 moved delivery-tracking persistence to notification-service)
spring.datasource.url=jdbc:mysql://localhost:3306/home_energy_tracker
spring.datasource.username=root
spring.datasource.password=password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Flyway - alert-service owns the `alert` table's migration; uses its own
# history table name since it shares the physical schema with user-service
# (which owns `user`/`device` and keeps Flyway's default history table name).
# baseline-on-migrate + baseline-version=0 is required because this service's
# Flyway run may see the shared schema already populated by a sibling service
# that started first (non-empty schema, no history table for *this* service) -
# without this Flyway refuses to proceed. baseline-version=0 (not the default
# of 1) ensures V1 still gets applied rather than treated as already covered.
spring.flyway.table=flyway_schema_history_alert
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
