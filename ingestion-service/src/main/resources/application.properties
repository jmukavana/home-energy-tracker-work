spring.application.name=ingestion-service
server.port = 8082

# Actuator & Prometheus (scraped by Prometheus in docker-compose)
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=when_authorized
management.metrics.tags.application=${spring.application.name}

spring.mvc.problemdetails.enabled=true

#Kafka
spring.kafka.bootstrap-servers=localhost:9094
spring.kafka.template.default-topic=energy-usage-v2
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=io.confluent.kafka.serializers.KafkaAvroSerializer
spring.kafka.producer.properties.schema.registry.url=http://localhost:8086


# Continuous simulation configuration
simulation.endpoint=http://localhost:8082/api/v1/ingestion
simulation.requests-per-interval=10000
simulation.interval-ms=60000
simulation.parallel-threads=10
