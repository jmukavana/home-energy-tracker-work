spring.application.name=billing-service
server.port = 8090

# Actuator & Prometheus (scraped by Prometheus in docker-compose)
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=when_authorized
management.metrics.tags.application=${spring.application.name}

spring.mvc.problemdetails.enabled=true

usage.service.url=http://localhost:8083/api/v1/usage

# Flat-rate billing (cents per kWh) — no tiered pricing exists to model yet.
billing.rate-per-kwh-cents=15

# Real Stripe SDK integration, off by default: no live Stripe test-mode key is
# available in this environment (requires the user's own Stripe account, same
# as Keycloak realm setup / insight-service's Ollama dependency elsewhere in
# this repo). Set both properties to enable real invoice-item creation.
billing.stripe.enabled=false
billing.stripe.api-key=

# MySQL — own database (see Phase 3 plan notes on per-service databases)
spring.datasource.url=jdbc:mysql://localhost:3306/billing_service
spring.datasource.username=root
spring.datasource.password=password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=none

# Own database, sole owner of its schema -> Flyway's default history table
# name is fine, no collision risk with any other service.
