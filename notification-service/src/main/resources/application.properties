spring.application.name=notification-service
server.port = 8087

# Actuator & Prometheus (scraped by Prometheus in docker-compose)
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=when_authorized
management.metrics.tags.application=${spring.application.name}

spring.mvc.problemdetails.enabled=true

#Kafka - consumer (notification-requests-v1, produced by alert-service and any
# future service that needs to notify a user)
spring.kafka.bootstrap-servers=localhost:9094
spring.kafka.consumer.group-id=notification-service
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=io.confluent.kafka.serializers.KafkaAvroDeserializer
spring.kafka.consumer.properties.schema.registry.url=http://localhost:8086
spring.kafka.consumer.properties.specific.avro.reader=true

# MySQL — own database, not shared with the legacy services (see Phase 3 plan
# notes: avoids reproducing the cross-service schema-ownership mess Phase 0
# had to untangle for the original 7 services).
spring.datasource.url=jdbc:mysql://localhost:3306/notification_service
spring.datasource.username=root
spring.datasource.password=password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=none

# Own database, sole owner of its schema -> Flyway's default history table
# name is fine, no collision risk with any other service.

# Mailpit SMTP Configuration (moved from alert-service)
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
