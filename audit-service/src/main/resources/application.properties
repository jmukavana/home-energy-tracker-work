spring.application.name=audit-service
server.port = 8089

# Actuator & Prometheus (scraped by Prometheus in docker-compose)
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=when_authorized
management.metrics.tags.application=${spring.application.name}

spring.mvc.problemdetails.enabled=true

#Kafka - consumer (audit-events-v1, produced today by identity-service)
spring.kafka.bootstrap-servers=localhost:9094
spring.kafka.consumer.group-id=audit-service
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=io.confluent.kafka.serializers.KafkaAvroDeserializer
spring.kafka.consumer.properties.schema.registry.url=http://localhost:8086
spring.kafka.consumer.properties.specific.avro.reader=true

# MySQL — own database (see Phase 3 plan notes on per-service databases)
spring.datasource.url=jdbc:mysql://localhost:3306/audit_service
spring.datasource.username=root
spring.datasource.password=password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=none

# Own database, sole owner of its schema -> Flyway's default history table
# name is fine, no collision risk with any other service.
