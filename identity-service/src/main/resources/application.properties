spring.application.name=identity-service
server.port = 8088

# Actuator & Prometheus (scraped by Prometheus in docker-compose)
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=when_authorized
management.metrics.tags.application=${spring.application.name}

spring.mvc.problemdetails.enabled=true

#Kafka - producer (audit-events-v1, consumed by audit-service)
spring.kafka.bootstrap-servers=localhost:9094
spring.kafka.template.default-topic=audit-events-v1
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=io.confluent.kafka.serializers.KafkaAvroSerializer
spring.kafka.producer.properties.schema.registry.url=http://localhost:8086

# MySQL — own database (see Phase 3 plan notes on per-service databases)
spring.datasource.url=jdbc:mysql://localhost:3306/identity_service
spring.datasource.username=root
spring.datasource.password=password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=none

# Own database, sole owner of its schema -> Flyway's default history table
# name is fine, no collision risk with any other service.
